# ─────────────────────────────────────────────────────────────
#  Synclook — Docker Compose (App + PostgreSQL)
# ─────────────────────────────────────────────────────────────

services:
  # ── Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synclook
      POSTGRES_USER: synclook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synclook_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclook -d synclook"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
