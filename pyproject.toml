[project]
name = "synclook-ai"
version = "0.1.0"
description = "Multi-agent AI fashion recommendation pipeline"
authors = [
    {name = "Synclook"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn[standard] (>=0.44.0,<0.45.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "pillow (>=12.2.0,<13.0.0)",
    "openai (>=2.31.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sse-starlette (>=3.3.4,<4.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "torch (>=2.11.0,<3.0.0)",
    "torchvision (>=0.26.0,<0.27.0)",
    "transformers (>=5.5.3,<6.0.0)",
    "greenlet (>=3.4.0,<4.0.0)",
    "langfuse (>=4.13.1,<5.0.0)",
    "langgraph (>=1.2.8,<2.0.0)",
    "langchain-openai (>=1.3.3,<2.0.0)",
    "pgvector (>=0.4.0,<0.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Flat layout (backend/, evaluation/, tests/ at the project root, no
# importable synclook_ai package) — Poetry's default package mode expects a
# source directory matching the project name and fails install without one.
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.10,<0.16.0)",
    "mypy (>=1.20.0,<2.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042 (str,Enum -> StrEnum) changes str() semantics of enum members; the
# clothing enums are serialized via .value everywhere, so the rewrite adds
# risk without benefit.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# pgvector ships no py.typed marker; its SQLAlchemy `Vector` type is used only
# as a column type, so the untyped import costs us nothing checkable.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
