name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The catalog retrieval eval runs against a real database: pgvector's index
    # behaviour and PostgreSQL full-text ranking are exactly what it measures,
    # so mocking them would measure nothing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synclook
          POSTGRES_PASSWORD: synclook
          POSTGRES_DB: synclook
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://synclook:synclook@localhost:5432/synclook

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py312-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-bge-minilm-v1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check backend/ tests/ evaluation/

      - name: Format check (ruff format)
        run: poetry run ruff format --check backend/ tests/ evaluation/

      - name: Type check (mypy strict)
        run: poetry run mypy backend/

      - name: Tests
        run: poetry run python -m pytest tests/ -q

      - name: Evaluation gate (recommendation quality)
        run: poetry run python evaluation/harness.py --check

      - name: Evaluation report (product relevance baseline)
        run: poetry run python evaluation/product_relevance.py

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Evaluation report (catalog retrieval arms)
        run: poetry run python evaluation/catalog_retrieval.py
