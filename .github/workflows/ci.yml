name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Plain Postgres: the migrations must apply to a fresh database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synclook
          POSTGRES_PASSWORD: synclook
          POSTGRES_DB: synclook
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://synclook:synclook@localhost:5432/synclook

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py312-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check backend/ tests/ evaluation/

      - name: Format check (ruff format)
        run: poetry run ruff format --check backend/ tests/ evaluation/

      - name: Type check (mypy strict)
        run: poetry run mypy backend/ evaluation/

      - name: Tests
        run: poetry run python -m pytest tests/ -q

      - name: Evaluation gate (outfit engine — 0 rule violations, empty rate, ms per request)
        run: poetry run python evaluation/outfit_engine.py --check

      - name: Evaluation report (product relevance baseline)
        run: poetry run python evaluation/product_relevance.py

      - name: Apply migrations
        run: poetry run alembic upgrade head
